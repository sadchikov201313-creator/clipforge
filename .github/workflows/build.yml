name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -o clipforge.zip -d proj
      - run: sed -i 's/^import java.io.File$/import java.io.File\nimport androidx.media3.transformer.Composition/' proj/app/src/main/java/com/clipforge/app/MainActivity.kt
      - name: Create own signing key
        run: |
          keytool -genkeypair -keystore proj/my.jks -alias key -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=ClipForge, O=ClipForge, C=RU"
          cat >> proj/app/build.gradle.kts <<'EOF'
          android {
              signingConfigs {
                  create("mine") {
                      storeFile = file("../my.jks")
                      storePassword = "android123"
                      keyAlias = "key"
                      keyPassword = "android123"
                      enableV1Signing = true
                      enableV2Signing = true
                  }
                  buildTypes {
                      getByName("debug") {
                          signingConfig = signingConfigs.getByName("mine")
                      }
                  }
              }
          }
          EOF
      - run: cd proj && gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/*.apk
