name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -o clipforge.zip -d proj
      - run: sed -i 's/^import java.io.File$/import java.io.File\nimport androidx.media3.transformer.Composition/' proj/app/src/main/java/com/clipforge/app/MainActivity.kt
      - run: cd proj && gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/*.apk
